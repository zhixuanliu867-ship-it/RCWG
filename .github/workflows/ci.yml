name: RCWG bootstrap acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standard-library unit tests, no credentials or live requests
        run: python -m unittest discover -s tests -v
      - name: Reference integrity and safe config
        run: python -m rcwg_boot check
      - name: Mock execution
        run: python -m rcwg_boot smoke
      - name: Formal gate must stay closed
        run: |
          set +e
          python -m rcwg_boot check --formal
          status=$?
          test "$status" -eq 2
      - name: SPEC001A contracts and metrology calculation core
        run: python -m rcwg_spec check
      - name: Synthetic metric fixture (no measured model results)
        run: python -m rcwg_spec demo --output runs/ci-spec001a/report.json
      - name: Public repository guard
        run: python scripts/check_public_tree.py
