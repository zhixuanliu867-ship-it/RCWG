name: RCWG complete offline SPEC acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Full SPEC001B gate including original tests and immutable sentinels
        run: |
          set +e
          python scripts/accept_spec001b.py --output runs/ci-spec001b
          status=$?
          cat runs/ci-spec001b/unittest.txt
          cat runs/ci-spec001b/ACCEPTANCE.json
          cat runs/ci-spec001b/*.stdout.txt
          cat runs/ci-spec001b/*.stderr.txt
          cat runs/ci-spec001b/negative-review-*-unittest.txt
          cat runs/ci-spec001b/negative-review-*-process.txt
          exit "$status"
      - name: Synthetic SPEC001A metric fixture (no measured model results)
        run: python -m rcwg_spec demo --output runs/ci-spec001a/report.json
