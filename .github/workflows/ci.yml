name: RCWG complete offline API acceptance
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
      - name: Full EXEC001 gate including original B and reference entry points
        run: |
          set +e
          python scripts/accept_exec001.py --output runs/ci-exec001
          status=$?
          cat runs/ci-exec001/ACCEPTANCE.json
          cat runs/ci-exec001/original-spec001b/unittest.txt
          cat runs/ci-exec001/reference-core/unittest.txt
          cat runs/ci-exec001/original-spec001b/negative-review-*-unittest.txt
          cat runs/ci-exec001/original-spec001b/negative-review-*-process.txt
          cat runs/ci-exec001/original-spec001b/*.stdout.txt
          cat runs/ci-exec001/original-spec001b/*.stderr.txt
          cat runs/ci-exec001/*.stderr.log
          exit "$status"
      - name: Retain sanitized CI summaries and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exec001-ci-evidence
          retention-days: 14
          path: |
            runs/ci-exec001/ACCEPTANCE.json
            runs/ci-exec001/runtime-coverage.json
            runs/ci-exec001/original-spec001b/*.txt
            runs/ci-exec001/original-spec001b/ACCEPTANCE.json
            runs/ci-exec001/reference-core/*.txt
            runs/ci-exec001/reference-core/ACCEPTANCE.json
      - name: Full API001 target gate (no credentials or live requests)
        run: |
          set +e
          python scripts/accept_api001.py --output runs/ci-api001
          status=$?
          cat runs/ci-api001/ACCEPTANCE.json
          cat runs/ci-api001/api-tests.log
          exit "$status"
      - name: Retain sanitized API001 CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api001-ci-evidence
          retention-days: 14
          path: |
            runs/ci-api001/ACCEPTANCE.json
            runs/ci-api001/*.log
            runs/ci-api001/api-unit/*.json
            runs/ci-api001/api-unit/*.txt
            runs/ci-api001/retained-exec/ACCEPTANCE.json
            runs/ci-api001/retained-exec/runtime-coverage.json
            runs/ci-api001/retained-exec/original-spec001b/*.txt
            runs/ci-api001/retained-exec/original-spec001b/ACCEPTANCE.json
            runs/ci-api001/retained-exec/reference-core/*.txt
            runs/ci-api001/retained-exec/reference-core/ACCEPTANCE.json
      - name: Synthetic SPEC001A metric fixture (no measured model results)
        run: python -m rcwg_spec demo --output runs/ci-spec001a/report.json
      - name: Cloud profile offline admission, wire parity and artifact review
        run: python scripts/accept_cloud001.py --output runs/ci-cloud001
      - name: Retain sanitized CLOUD001 offline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud001-ci-evidence
          retention-days: 14
          path: |
            runs/ci-cloud001/ACCEPTANCE.json
            runs/ci-cloud001/unittest.log
